<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Order summary component"
  >

  <title>Order Summary</title>

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="./images/favicon-32x32.png"
  >

  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="page-container">
    <article class="order-card">

      <div class="hero-image-container">
        <img
          src="./images/illustration-hero.svg"
          alt="Person listening to music"
          class="hero-image"
        >
      </div>

      <div class="card-content">
        <h1 class="heading">Order Summary</h1>

        <p class="summary-para">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

        <section
          class="plan-details"
          aria-label="Selected subscription plan"
        >
          <div class="plan-info">
            <div class="music-icon">
              <img
                src="./images/icon-music.svg"
                alt=""
                aria-hidden="true"
              >
            </div>

            <div class="plan-text">
              <h3>Annual Plan</h3>
              <p>$59.99/year</p>
            </div>
          </div>

          <div class="change-link">
            <a href="#">Change</a>
          </div>
        </section>

        <a href="#" class="proceed-btn">
          Proceed to Payment
        </a>

        <button type="button" class="cancel-order">
          Cancel Order
        </button>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by
    <a
      href="https://www.crio.do/"
      target="_blank"
      rel="noopener noreferrer"
    >
      Crio.Do
    </a>.

    Coded by
    <a href="#">Ram Avtar</a>.
  </footer>
</body>
</html>
